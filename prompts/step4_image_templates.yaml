# 第四步静态生图提示词模板
#
# 编辑说明：
# - 配置文件通过 step4.image_prompt_template 选择下面的模板 ID。
# - label 和 description 仅供人类阅读，不会发送给生图模型。
# - template 中必须保留 {summary}、{segment}、{style_block} 三个变量。
# - 使用 YAML 的 | 多行文本格式，缩进两个空格即可原样编辑提示词。

descriptions:
  label: 原有图示关键词模板
  description: 完整保留项目原有模板，以图示为主、中文关键词为辅。
  template: |
    为视频文案的每一段生成一张配图，用图示为主、文字为辅，帮助读者更好地理解内容。
    文字规范：只需要2到4个突出段落主旨的关键词。每个词都以极度简短为第一原则。关键词与背景颜色形成鲜明反差，确保可读性。
    配图规范：文字必须为中文，位置只能出现在图片的上半部分。整体画面应匹配内容主题，简约美观，不得出现诡异、恐怖的元素。

    以下是全文概述，不是展示的重点：
    {{
    {summary}
    }}

    以下是需要生成配图的文案内容，信息的核心：
    {{
    {segment}
    }}

    请严格遵循以下画面风格设定：
    {{
    {style_block}
    }}

pure_images:
  label: 纯图
  description: 生成无文字、主体明确、具有情绪张力的电影感场景。
  template: |
    为当前视频段落生成一张电影感叙事配图。画面必须无文字，以明确主体、真实空间关系、光影和情绪张力表达内容；不得出现任何文字、字母、数字、标识或水印。

    以下是全文概述，仅用于理解上下文与保持系列画面连贯：
    {{
    {summary}
    }}

    以下是当前配图必须准确表达的文案内容：
    {{
    {segment}
    }}

    请严格遵循以下画面风格设定：
    {{
    {style_block}
    }}

editorial:
  label: 现代编辑设计模板
  description: 将内容转化为对比、层级、流程或趋势等知识信息图结构。
  template: |
    为视频文案的每一段生成一张配图，用图示为主、文字为辅，帮助读者更好地理解内容。
    文字规范：只需要2到4个突出段落主旨的关键词。每个词都以极度简短为第一原则。关键词与背景颜色形成鲜明反差，确保可读性。
    配图规范：文字必须为中文，位置只能出现在图片的上半部分。整体画面应匹配内容主题，简约美观，不得出现诡异、恐怖的元素。

    以下是全文概述，仅用于统一背景语境：
    {{
    {summary}
    }}

    以下是当前画面的核心信息来源：
    {{
    {segment}
    }}

    请严格遵循以下画面风格设定：
    {{
    {style_block}
    }}
